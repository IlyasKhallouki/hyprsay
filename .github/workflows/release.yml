name: release

# Publishes to PyPI on a version tag via Trusted Publishing (OIDC), no
# API token stored anywhere. One-time PyPI setup is documented in
# RELEASING.md (add a pending publisher for this repo + workflow).
#
# The MCP registry entry (server.json) goes out the same way: GitHub's OIDC
# token proves we own the io.github.IlyasKhallouki namespace, so there is no
# stored credential for that either.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token proving the io.github.<owner> namespace
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check server.json matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(jq -r '.version' server.json)"
          if [ "$declared" != "$version" ]; then
            echo "server.json version $declared != tag $version" >&2
            exit 1
          fi

      # The registry validates the entry against the release we just pushed,
      # and a fresh upload takes a moment to appear in PyPI's JSON API; publish
      # before it lands and validation fails with a 404 on the version.
      - name: Wait for the release to appear on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 30); do
            if curl -sfo /dev/null "https://pypi.org/pypi/hypruse/$version/json"; then
              echo "hypruse $version is live on PyPI"
              exit 0
            fi
            sleep 10
          done
          echo "hypruse $version did not appear on PyPI within 5 minutes" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes "See [CHANGELOG.md](CHANGELOG.md)."
          dist/*
